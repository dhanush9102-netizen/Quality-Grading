[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agrigrade"
version = "0.1.0"
description = "AgriGrade AI: class-conditioned multi-spectral produce quality grading"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# The shared spine must stay lightweight: it is imported by the mobile client,
# the API and every workstream branch. Heavyweight deps live in the extras
# below so each branch installs only what it owns.
dependencies = []

[project.optional-dependencies]
# branch: feature-extraction
features = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "scikit-image>=0.22",
]
# branch: model
model = [
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "onnx>=1.16",
  "onnxruntime>=1.18",
  "shap>=0.45",
]
# shared: HTTP surface consumed by the frontend branch
api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "pillow>=10.2",
]
# branch: frontend
frontend = [
  "httpx>=0.27",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.9",
  "types-opencv-python",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agrigrade = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "ANN", "RUF"]

[tool.mypy]
python_version = "3.11"
packages = ["agrigrade"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "features: contract tests owned by the feature-extraction branch",
  "model: contract tests owned by the model branch",
  "frontend: contract tests owned by the frontend branch",
  "integration: cross-workstream tests, only run on main",
]
